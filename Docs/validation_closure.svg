<text x="540" y="238" text-anchor="middle" font-size="12.5" fill="#4A5C68">one pole vertex, one triangle fan</text>
<polygon points="540,254 490,290 515,290" fill="#E4F2F3" stroke="#0B6E7A" stroke-width="1"/>
<polygon points="540,254 515,290 540,290" fill="#E4F2F3" stroke="#0B6E7A" stroke-width="1"/>
