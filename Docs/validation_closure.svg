<text x="540" y="196" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0B6E7A" font-family="ui-monospace, monospace">0 boundary edges</text>

<line x1="20" y1="214" x2="700" y2="214" stroke="#DCE3E7" stroke-width="1"/>

