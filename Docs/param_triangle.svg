    <circle cx="360" cy="90" r="4" fill="#0f172a"/>
    <text x="112" y="270" font-size="13" text-anchor="end" fill="#0f172a">V0 (eta=0, zeta=0)</text>
    <text x="112" y="86" font-size="13" text-anchor="end" fill="#0f172a">V1 (0, 1)</text>
    <text x="368" y="86" font-size="13" fill="#0f172a">V2 (1, 1)</text>
